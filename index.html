<!DOCTYPE html>
<html>
<head>
  <title>Carbon Credit Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">

<div class="p-4 max-w-4xl mx-auto">

<h1 class="text-2xl font-bold mb-4">Carbon Credit Exchange</h1>

<div id="auth">
  <input id="email" placeholder="Email" class="p-2 text-black" />
  <input id="password" type="password" placeholder="Password" class="p-2 text-black" />
  <button onclick="login()" class="bg-emerald-500 px-4 py-2">Login</button>
</div>

<hr class="my-4" />

<div id="postBox">
  <input id="title" placeholder="Title" class="p-2 text-black" />
  <input id="img" placeholder="Image URL" class="p-2 text-black" />
  <textarea id="desc" placeholder="Description" class="p-2 text-black"></textarea>
  <button onclick="post()" class="bg-blue-500 px-4 py-2">Post</button>
</div>

<div id="feed"></div>

</div>

<script src="app.js"></script>
</body>
</html>
