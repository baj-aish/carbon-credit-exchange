<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carbon Credit Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-50 min-h-screen">
  <!-- Navbar -->
<header class="w-full bg-slate-900 border-b border-slate-800 p-3 flex items-center gap-4">
  <div class="text-white font-bold">Carbon Credit Exchange</div>
  <nav class="ml-6 flex gap-2 items-center">
    <button class="nav-btn px-3 py-1 rounded protected-nav" data-section="landing">Home</button>
    <button class="nav-btn px-3 py-1 rounded protected-nav" data-section="feed">Feed</button>
    <button class="nav-btn px-3 py-1 rounded protected-nav" data-section="upload">Marketplace</button>
    <button class="nav-btn px-3 py-1 rounded" data-section="calculator">Calculator</button>
    <button class="nav-btn px-3 py-1 rounded protected-nav" data-section="inbox">Inbox <span id="inboxIndicator" class="hidden inline-block ml-1 text-xs bg-red-500/20 rounded px-1">•</span></button>
    <button class="nav-btn px-3 py-1 rounded protected-nav admin-only" data-section="admin" id="adminTab" style="display:none;">Admin</button>
  </nav>

  <div class="ml-auto flex items-center gap-2">
    <button id="heroExploreBtn" class="px-3 py-1 rounded bg-emerald-600 text-white">Explore</button>
    <button id="heroLoginBtn" class="px-3 py-1 rounded border border-slate-700">Login</button>
    <button id="loginBtn" class="hidden">Login</button>
    <button id="logoutBtn" class="hidden">Logout</button>

    <div id="userBadge" class="hidden ml-3 bg-slate-800 px-2 py-1 rounded flex items-center gap-2">
      <span id="badgeName" class="text-sm text-white"></span>
      <span id="badgeRole" class="text-xs text-slate-300"></span>
    </div>
  </div>
</header>


 <main class="p-6">
  <!-- Landing -->
  <section id="section-landing" class="section">
    <div class="max-w-3xl mx-auto text-center">
      <h1 class="text-2xl text-white">Welcome to Carbon Credit Exchange</h1>
      <p id="welcomeLine" class="hidden text-slate-300">Hello, <span id="welcomeName"></span></p>
      <div class="mt-4">
        <button id="heroLoginBtn" class="px-3 py-2 rounded bg-emerald-600 text-white">Login / Register</button>
        <button id="heroExploreBtn" class="px-3 py-2 rounded border border-slate-700 ml-2">Explore</button>
      </div>
    </div>
  </section>

  <!-- Feed -->
  <section id="section-feed" class="section hidden">
    <div class="flex gap-4">
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-3">
          <select id="creditsFilter" class="px-2 py-1 bg-slate-800"> 
            <option value="all">Credits: All</option>
            <option value="1-10">1-10</option>
            <option value="10-20">10-20</option>
            <option value="20-30">20-30</option>
            <option value="30-40">30-40</option>
            <option value="40-50">40-50</option>
            <option value="50+">50+</option>
          </select>
          <select id="priceFilter" class="px-2 py-1 bg-slate-800">
            <option value="none">Sort price</option>
            <option value="low-high">Low → High</option>
            <option value="high-low">High → Low</option>
          </select>
        </div>

        <div id="feedContainer" class="grid grid-cols-1 gap-3"></div>
        <div id="emptyFeedMsg" class="text-slate-400 mt-4 hidden">No posts yet.</div>
      </div>

      <aside class="w-64">
        <div id="userListings" class="mb-4"></div>
        <div class="bg-slate-900 p-3 rounded">
          <h4 class="text-sm text-slate-300 mb-2">Inbox</h4>
          <div id="inboxList"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- Upload / Marketplace -->
  <section id="section-upload" class="section hidden">
    <div id="uploadWrapper">
      <div class="flex gap-2 mb-3">
        <button id="yourListingsTab" class="px-3 py-1 bg-slate-900">Your Listings</button>
        <button id="createListingTab" class="px-3 py-1 bg-slate-800">Create Listing</button>
      </div>

      <div id="userListings" class="mb-4"></div>

      <div id="uploadWrapper" class="hidden">
        <form id="uploadForm" class="space-y-2">
          <input id="postTitle" placeholder="Title" class="w-full p-2 bg-slate-900 border border-slate-700" />
          <textarea id="postDesc" placeholder="Description" class="w-full p-2 bg-slate-900 border border-slate-700"></textarea>
          <input id="postPrice" placeholder="Price" type="number" class="p-2 bg-slate-900 border border-slate-700" />
          <input id="postCredits" placeholder="Credits" type="number" class="p-2 bg-slate-900 border border-slate-700" />
          <input id="postImage" type="file" accept="image/*" />
          <button id="uploadFormBtn" class="px-3 py-2 bg-emerald-600 text-white rounded">Upload Listing</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Inbox -->
  <section id="section-inbox" class="section hidden">
    <h2 class="text-white">Inbox</h2>
    <div id="inboxList"></div>
  </section>

  <!-- Admin -->
  <section id="section-admin" class="section hidden">
    <div id="adminList"></div>
  </section>

  <!-- Calculator -->
  <section id="section-calculator" class="section hidden">
    <h2 class="text-white mb-2">Carbon Calculator</h2>
    <div>
      <label><input type="radio" name="calcMethod" value="trees" checked> Trees</label>
      <label><input type="radio" name="calcMethod" value="land"> Land</label>

      <div id="treeForm" class="mt-3">
        <select id="treeType">
          <option value="3.5">Small plants (3.5 kg/yr)</option>
          <option value="12.5">Medium trees (12.5 kg/yr)</option>
          <option value="22.5">Fast growing (22.5 kg/yr)</option>
        </select>
        <input id="treeCount" placeholder="Number of trees" type="number" />
        <input id="treeYears" placeholder="Years" type="number" />
        <button id="calcTreesBtn">Calculate</button>
      </div>

      <div id="landForm" class="mt-3 hidden">
        <input id="landArea" placeholder="Area" type="number" />
        <select id="landUnit"><option value="hectares">hectares</option><option value="acres">acres</option></select>
        <input id="landYears" placeholder="Years" type="number" />
        <button id="calcLandBtn">Calculate</button>
      </div>

      <div id="calcResult" class="mt-3 hidden">
        <p id="annualCredits"></p>
        <p id="totalCredits"></p>
      </div>
    </div>
  </section>
</main>


  <!-- Chat Modal -->
 <!-- Chat Modal -->
<div id="chatModal" class="hidden fixed inset-0 flex items-end justify-center p-4 bg-black/50">
  <div class="w-full max-w-2xl bg-slate-900 rounded p-3">
    <div class="flex items-center justify-between mb-2">
      <h4 id="chatPostTitle" class="text-white">Chat</h4>
      <button id="closeChat" class="text-slate-300">Close</button>
    </div>

    <div id="chatMessages" class="h-48 overflow-auto bg-slate-800 p-2 rounded mb-2"></div>

    <form id="chatForm" class="flex gap-2">
      <input id="chatInput" class="flex-1 p-2 bg-slate-800" placeholder="Type a message..." />
      <button type="submit" class="px-3 py-1 bg-emerald-600">Send</button>
    </form>
  </div>
</div>


  <!-- Login / Register Modal -->
 <!-- Login/Register Modal -->
<div id="loginModal" class="hidden fixed inset-0 flex items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-md bg-slate-900 p-4 rounded shadow">
    <div class="flex gap-2 mb-2">
      <button id="tabRegister" class="bg-slate-800 px-3 py-1">Register</button>
      <button id="tabLogin" class="bg-slate-900 px-3 py-1">Login</button>
      <button id="closeLogin" class="ml-auto">Close</button>
    </div>

    <form id="registerForm" class="space-y-2">
      <input id="regName" placeholder="Username" class="w-full p-2 bg-slate-800"/>
      <input id="regEmail" placeholder="Email" class="w-full p-2 bg-slate-800"/>
      <select id="regRole" class="w-full p-2 bg-slate-800">
        <option value="user">User</option>
        <option value="admin">Admin (only Bajaish)</option>
      </select>
      <button type="submit" class="px-3 py-1 bg-emerald-600">Register</button>
    </form>

    <form id="loginForm" class="hidden space-y-2">
      <input id="loginName" placeholder="Username" class="w-full p-2 bg-slate-800"/>
      <select id="loginRole" class="w-full p-2 bg-slate-800">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit" class="px-3 py-1 bg-emerald-600">Login</button>
    </form>
  </div>
</div>


<!-- scripts -->
<script src="app.js"></script>
</body>
</html>
